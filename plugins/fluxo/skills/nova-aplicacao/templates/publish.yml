# Modelo: publica no GHCR a imagem de cada app que tiver Dockerfile, a cada push na branch principal e em tags.
# Mantenha só as apps escolhidas. O deploy no servidor é do responsável, pelo manifesto no repositório infra.
name: publish

on:
  push:
    branches: [{{branch}}]
    tags: ["{{backend}}-v*", "{{frontend}}-v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Imagem ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [{{apps_com_imagem}}]
    steps:
      - uses: actions/checkout@v5
      - id: has
        run: |
          if [ -f "apps/${{ matrix.app }}/Dockerfile" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.has.outputs.ok == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/liane-alimentos/{{slug}}-${{ matrix.app }}
          tags: |
            type=sha
            type=ref,event=branch
            type=match,pattern=${{ matrix.app }}-v(.*),group=1
      - if: steps.has.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
